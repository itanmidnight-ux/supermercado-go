name: supermercado_go
description: Aplicación de supermercado con interfaz futurista
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animaciones
  glassmorphism: ^3.0.0
  animations: ^2.0.8
  lottie: ^2.7.0
  shimmer: ^3.0.0
  
  # Navegación & Estado
  provider: ^6.1.1
  get: ^4.6.6
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # Imágenes
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  photo_view: ^0.14.0
  
  # Mapas & Ubicación
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.1
  
  # Autenticación & Seguridad
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  connectivity_plus: ^5.0.2
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700