<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi cuenta — Supermercado GO</title>
    <meta name="description" content="Iniciá sesión, creá tu cuenta o revisá tu historial de pedidos en Supermercado GO." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/cuenta-BLFlqpgp.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/layout-DL_c9wR6.js">
    <link rel="stylesheet" crossorigin href="/assets/layout-BbtxrmYY.css">
    <link rel="stylesheet" crossorigin href="/assets/cuenta-gUSl3YeT.css">
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container cuenta">
      <!-- Sin sesión: login / registro / recuperar contraseña -->
      <section class="cuenta__auth" id="cuenta-auth" data-reveal="up">
        <div class="auth-card">
          <div class="auth-tabs" id="auth-tabs">
            <button type="button" class="auth-tab is-active" data-tab="login">Iniciar sesión</button>
            <button type="button" class="auth-tab" data-tab="register">Crear cuenta</button>
          </div>

          <div class="auth-panels" id="auth-panels">
            <!-- Login -->
            <form class="auth-form" id="login-form" novalidate>
              <label class="form-field">
                <span>Celular, correo o usuario</span>
                <input type="text" name="username" autocomplete="username" required />
              </label>
              <label class="form-field">
                <span>Contraseña</span>
                <input type="password" name="password" autocomplete="current-password" required />
              </label>
              <p class="form-error" id="login-error" hidden></p>
              <button type="submit" class="btn btn-primary auth-submit" id="login-submit">Iniciar sesión</button>
              <div class="auth-links">
                <button type="button" class="auth-link" data-tab-goto="forgot">¿Olvidaste tu contraseña?</button>
              </div>
            </form>

            <!-- Registro -->
            <form class="auth-form" id="register-form" hidden novalidate>
              <label class="form-field">
                <span>Nombre completo</span>
                <input type="text" name="display_name" autocomplete="name" required minlength="2" />
              </label>
              <label class="form-field">
                <span>Correo electrónico</span>
                <input type="email" name="email" autocomplete="email" required />
              </label>
              <label class="form-field">
                <span>Celular (10 dígitos, ej: 3138207044)</span>
                <input type="tel" name="phone" autocomplete="tel" required pattern="[0-9]{10}" />
              </label>
              <label class="form-field">
                <span>Dirección de entrega</span>
                <input type="text" name="address" autocomplete="street-address" required minlength="5" />
              </label>
              <label class="form-field">
                <span>Contraseña (mínimo 8 caracteres)</span>
                <input type="password" name="password" autocomplete="new-password" required minlength="8" />
              </label>
              <label class="form-field">
                <span>Confirmar contraseña</span>
                <input type="password" name="password2" autocomplete="new-password" required minlength="8" />
              </label>
              <p class="form-error" id="register-error" hidden></p>
              <p class="form-success" id="register-success" hidden></p>
              <button type="submit" class="btn btn-primary auth-submit" id="register-submit">Crear cuenta</button>
            </form>

            <!-- Recuperar contraseña (OTP por correo) -->
            <div class="auth-form" id="forgot-panel" hidden>
              <button type="button" class="auth-back" data-tab-goto="login">&larr; Volver a iniciar sesión</button>

              <form id="forgot-request-form" class="auth-form">
                <label class="form-field">
                  <span>Tu correo electrónico</span>
                  <input type="email" name="email" autocomplete="email" required />
                </label>
                <p class="form-error" id="forgot-request-error" hidden></p>
                <p class="form-success" id="forgot-request-success" hidden></p>
                <button type="submit" class="btn btn-primary auth-submit" id="forgot-request-submit">
                  Enviar código
                </button>
              </form>

              <form id="forgot-reset-form" class="auth-form" hidden>
                <label class="form-field">
                  <span>Código de 6 dígitos</span>
                  <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
                  <small>Lo enviamos a tu correo, vence en 5 minutos.</small>
                </label>
                <label class="form-field">
                  <span>Nueva contraseña</span>
                  <input type="password" name="new_password" autocomplete="new-password" required minlength="8" />
                </label>
                <p class="form-error" id="forgot-reset-error" hidden></p>
                <p class="form-success" id="forgot-reset-success" hidden></p>
                <button type="submit" class="btn btn-primary auth-submit" id="forgot-reset-submit">
                  Restablecer contraseña
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- Con sesión: perfil + historial -->
      <section class="cuenta__profile" id="cuenta-profile" hidden data-reveal="up">
        <div class="profile-card">
          <div class="profile-card__info">
            <h2 id="profile-name">—</h2>
            <p id="profile-email">—</p>
            <p id="profile-phone">—</p>
          </div>
          <button type="button" class="btn btn-secondary cuenta__logout" id="logout-btn">Cerrar sesión</button>
        </div>

        <h3 class="cuenta__section-title">Mis pedidos</h3>
        <div class="orders-list" id="orders-list" aria-live="polite"></div>
        <p class="orders-empty" id="orders-empty" hidden>Todavía no tenés pedidos registrados.</p>
        <p class="form-error" id="orders-error" hidden>No pudimos cargar tu historial. Probá de nuevo en un momento.</p>
      </section>
    </main>

    <div id="site-footer"></div>

  </body>
</html>
