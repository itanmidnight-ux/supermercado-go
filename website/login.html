<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Supermercado GO</title>
    <meta name="description" content="Iniciá sesión en Supermercado GO." />
    <script>
      // login.html es un alias de cuenta.html (que ya cubre login + registro
      // en una sola pantalla con estados) -- redirige preservando ?redirect=
      // para no duplicar la lógica de auth en dos lugares.
      var params = new URLSearchParams(window.location.search);
      var target = 'cuenta.html' + (params.toString() ? '?' + params.toString() : '');
      window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0; url=cuenta.html" />
  </head>
  <body>
    <p>
      Redirigiendo a <a href="cuenta.html">Mi cuenta</a>…
    </p>
  </body>
</html>
