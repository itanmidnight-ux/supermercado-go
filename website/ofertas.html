<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofertas — Supermercado GO</title>
    <meta name="description" content="Ofertas de la semana en Supermercado GO: los productos destacados, en un solo lugar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container catalog">
      <nav class="breadcrumb" id="ofertas-breadcrumb" aria-label="Ruta de navegación"></nav>

      <section class="catalog__head" data-reveal="up">
        <h1 class="catalog__title">
          <span class="ofertas__title-icon" data-icon="star" data-icon-size="28" aria-hidden="true"></span>
          Ofertas de la semana
        </h1>
        <p class="catalog__subtitle">Los productos destacados de Supermercado GO, todos en un solo lugar.</p>
      </section>

      <section class="catalog__grid" id="ofertas-grid" aria-live="polite"></section>

      <p class="catalog__empty" id="ofertas-empty" hidden>
        <span data-icon="cart" data-icon-size="18" aria-hidden="true"></span> Todavía no hay ofertas cargadas.
      </p>

      <p class="catalog__error" id="ofertas-error" hidden>
        <span data-icon="shield-check" data-icon-size="18" aria-hidden="true"></span> No pudimos cargar las ofertas. Probá de nuevo en un momento.
      </p>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/scripts/ofertas.ts"></script>
  </body>
</html>
