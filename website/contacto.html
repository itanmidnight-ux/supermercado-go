<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto — Supermercado GO</title>
    <meta name="description" content="Contactá a Supermercado GO: WhatsApp, correo, dirección, horario de atención y redes sociales." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container contacto">
      <section class="contacto__head" data-reveal="up">
        <h1 class="contacto__title" id="contacto-title">Contacto</h1>
        <p class="contacto__subtitle" id="contacto-subtitle">Estamos para ayudarte.</p>
      </section>

      <div class="contacto__layout">
        <div class="contacto__cards" id="contacto-cards" data-reveal="stagger">
          <article class="contacto__card" data-reveal-item>
            <div class="contacto__card-icon" aria-hidden="true">💬</div>
            <div class="contacto__card-body">
              <h3>WhatsApp</h3>
              <p id="contacto-phone" class="skeleton skeleton--text contacto__skeleton"></p>
              <a href="#" id="contacto-whatsapp-link" class="btn btn-primary contacto__whatsapp-btn" hidden>
                Escribinos por WhatsApp
              </a>
            </div>
          </article>

          <article class="contacto__card" data-reveal-item>
            <div class="contacto__card-icon" aria-hidden="true">✉️</div>
            <div class="contacto__card-body">
              <h3>Correo</h3>
              <p id="contacto-email" class="skeleton skeleton--text contacto__skeleton"></p>
            </div>
          </article>

          <article class="contacto__card" data-reveal-item>
            <div class="contacto__card-icon" aria-hidden="true">📍</div>
            <div class="contacto__card-body">
              <h3>Dirección</h3>
              <p id="contacto-address" class="skeleton skeleton--text contacto__skeleton"></p>
            </div>
          </article>

          <article class="contacto__card" data-reveal-item>
            <div class="contacto__card-icon" aria-hidden="true">🕒</div>
            <div class="contacto__card-body">
              <h3>Horario de atención</h3>
              <p id="contacto-horario" class="skeleton skeleton--text contacto__skeleton"></p>
            </div>
          </article>

          <article class="contacto__card" data-reveal-item>
            <div class="contacto__card-icon" aria-hidden="true">📲</div>
            <div class="contacto__card-body">
              <h3>Redes sociales</h3>
              <div class="contacto__social" id="contacto-social">
                <span class="skeleton skeleton--text contacto__skeleton"></span>
              </div>
            </div>
          </article>
        </div>

        <div class="contacto__map" data-reveal="fade">
          <span class="contacto__map-pin" aria-hidden="true">📍</span>
          <span id="contacto-map-label">Supermercado GO</span>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="/src/scripts/contacto.ts"></script>
  </body>
</html>
