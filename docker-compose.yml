version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: supermercados-go-server
    restart: unless-stopped
    expose:
      - "3777"
    volumes:
      - server-data:/app/data
      - wa-session:/app/data/wa-session
    environment:
      - NODE_ENV=production
      - PORT=3777
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      - JWT_ISSUER=${JWT_ISSUER:-supermercados-go-api}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-supermercados-go-client}
      - WA_ENABLED=${WA_ENABLED:-false}
      - WA_BUSINESS_NUMBER=${WA_BUSINESS_NUMBER:-}
      - WA_ACCESS_TOKEN=${WA_ACCESS_TOKEN:-}
      - WA_PHONE_ID=${WA_PHONE_ID:-}
    networks:
      - supermercados-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3777/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: supermercados-go-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      server:
        condition: service_healthy
    networks:
      - supermercados-net

  certbot:
    image: certbot/certbot
    container_name: supermercados-go-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - supermercados-net

volumes:
  server-data:
  wa-session:
  certbot-conf:
  certbot-www:

networks:
  supermercados-net:
    driver: bridge
