name: supermercados_go
description: App de delivery para Supermercados Go - Cúcuta
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  mobile_scanner: ^3.5.5
  signature: ^5.5.0
  pdf: ^3.10.7
  printing: ^5.11.1
  url_launcher: ^6.2.4
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  path_provider: ^2.1.2
  file_picker: ^6.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
